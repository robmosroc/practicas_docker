<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Inscripción del alumnado</h1>

        <p class="descripcion">
            Introduce tus datos académicos:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="grupo">
                <label for="Actividad">Actividad:</label>
                <select id="Actividad" name="Actividad" required>
                    <option value="">Selecciona la actividad</option>
                    <option value="1">Robótica</option>
                    <option value="2">Desarrollo de videojuegos</option>
                    <option value="3">Ciberseguridad</option>
                    <option value="4">Diseño e impresión 3D</option>
                </select>
            </div>

            <div class="grupo">
                <label>Turno:</label>

                <div class="seleccion-ciclo">
                    <label class="opcion-ciclo">
                        <input type="radio" name="turno" value="morning" required>
                        Mañana
                    </label>

                    <label class="opcion-ciclo">
                        <input type="radio" name="turno" value="afternoon">
                        Tarde
                    </label>
                </div>
            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Material necesario:
                </p>

                <label class="opcion" for="portatil">
                    <input
                        type="checkbox"
                        id="portatil"
                        name="portatil"
                        value="true"
                    >
                    Dispongo de ordenador portátil propio.
                </label>

                <label class="opcion" for="auriculares">
                    <input
                        type="checkbox"
                        id="auriculares"
                        name="auriculares"
                        value="true"
                    >
                    Dispongo de auriculares.
                </label>
                
                <label class="opcion" for="escritura">
                    <input
                        type="checkbox"
                        id="escritura"
                        name="escritura"
                        value="true"
                    >
                    Dispongo de material de escritura.
                </label>

            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Observaciones:
                </p>

                <label class="observaciones" for="observaciones">
                    <textarea id="observaciones" name="observaciones" rows="5" cols="33">
                    </textarea>
                </label>


            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

        <p class="nota">
            Los datos introducidos se enviarán al servidor mediante
            el método GET.
        </p>

    </div>

</body>
</html>
